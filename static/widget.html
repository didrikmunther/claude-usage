<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Usage pill</title>
<style>
  /* Modelled on reflect-mono's quick-pill: 46px tall, fully rounded, dark
     gradient with a hairline top highlight and a long soft shadow. Deliberately
     dark in both themes — like the original, it is an overlay, not a document. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body {
    font: 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  #root {
    height: 100%;
    display: flex; align-items: center; justify-content: flex-start;
    padding: 8px;
  }
  #pill {
    height: 46px;
    border-radius: 24px;
    background: linear-gradient(180deg, #1c1c1c 0%, #111 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    /* No outer drop shadow: harmless at rest, but once hover takes the pill to
       full opacity it read as a dark halo around the edge. The inset hairline
       still lifts the top edge. */
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    display: inline-flex; align-items: center;
    gap: 14px;
    padding: 0 16px;
    white-space: nowrap;
    /* Near-invisible at rest, solid the moment you point at it. `.hover` is set
       natively: the drag overlay eats mouse events so the page never sees CSS
       :hover (see widget_panel.DragOverlay). */
    opacity: 0.22;
    transition: opacity 140ms ease-out;
  }
  html.hover #pill { opacity: 1; }

  .item { display: inline-flex; align-items: center; gap: 7px; }
  .mark { width: 15px; height: 15px; flex: 0 0 15px; display: block; }
  .val {
    /* Tabular + a floor width so the pill does not twitch as digits change. */
    font-variant-numeric: tabular-nums;
    font-size: 13px; font-weight: 590; letter-spacing: -0.01em;
    min-width: 46px;
    color: rgba(255, 255, 255, 0.55);
  }
  .val.bad { color: #ff6b6b; }
  .val.good { color: #4ade80; }
</style>
</head>
<body>
  <div id="root">
    <div id="pill">
      <span class="item">
        <!-- Claude's radial burst, drawn as tapered spokes (an approximation). -->
        <svg class="mark" viewBox="0 0 24 24" aria-label="Claude">
          <g fill="#f59e0b">
            <rect x="10.9" y="1.6" width="2.2" height="20.8" rx="1.1" transform="rotate(0 12 12)"/>
            <rect x="10.9" y="1.6" width="2.2" height="20.8" rx="1.1" transform="rotate(30 12 12)"/>
            <rect x="10.9" y="1.6" width="2.2" height="20.8" rx="1.1" transform="rotate(60 12 12)"/>
            <rect x="10.9" y="1.6" width="2.2" height="20.8" rx="1.1" transform="rotate(90 12 12)"/>
            <rect x="10.9" y="1.6" width="2.2" height="20.8" rx="1.1" transform="rotate(120 12 12)"/>
            <rect x="10.9" y="1.6" width="2.2" height="20.8" rx="1.1" transform="rotate(150 12 12)"/>
          </g>
        </svg>
        <span class="val" id="cVal">–</span>
      </span>
      <span class="item">
        <!-- OpenAI's hexagonal knot, simplified to a stroked hex rosette. -->
        <svg class="mark" viewBox="0 0 24 24" aria-label="Codex">
          <path d="M12 3.2 19.6 7.6 19.6 16.4 12 20.8 4.4 16.4 4.4 7.6 Z"
                fill="none" stroke="#8c8cf5" stroke-width="2.1"
                stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M12 3.2 12 12 19.6 16.4 M12 12 4.4 16.4"
                fill="none" stroke="#8c8cf5" stroke-width="2.1"
                stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
        </svg>
        <span class="val" id="xVal">–</span>
      </span>
    </div>
  </div>
  <script src="/static/forecast.js"></script>
  <script src="/static/widget.js"></script>
</body>
</html>
